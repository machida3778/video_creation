[project]
name = "video-creation"
version = "0.1.0"
description = "Harness that turns a one-line request into a finished vertical short (open-weights models only)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "budoux>=0.7",
  "pillow>=11.0",
]

[project.scripts]
vg = "vg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vg"]
