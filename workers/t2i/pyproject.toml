# GPU worker environment for text-to-image on x86_64 GPU servers and HPC clusters.
# Build and validate on a GPU host; CPU servers may share the working tree.
[project]
name = "worker-t2i"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "torch==2.9.1",
  "diffusers>=0.36",
  "transformers>=4.57",
  "accelerate>=1.10",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "pillow>=11",
  "huggingface-hub>=0.35",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
