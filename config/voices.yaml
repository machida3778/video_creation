    gender: male
    tone: [落ち着いた, 低め, ドキュメンタリー, ニュース]
    role: narrator
    voice_description: 落ち着いた低めの成人男性。明瞭な標準語。控えめな抑揚。
    license: MIT (Irodori-TTS v4.1 Small)
    license_url: https://huggingface.co/Aratako/Irodori-TTS-v4.1-Small
    commercial_ok: true

  - id: narrator_female_announcer
    engine: irodori
    status: pending
    model: Aratako/Irodori-TTS-v4.1-Small
    name: 女性ナレーター（アナウンサー風）
