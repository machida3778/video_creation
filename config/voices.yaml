  - id: vv_no7
    engine: voicevox
    speed: 1.3          # default short-form narration tempo
    speaker: No.7/ノーマル
    name: No.7
    aliases: [No.7, ナンバーセブン]
    gender: female
    tone: [力強い, アナウンサー, はっきり]
    license: No.7 利用規約
    license_url: https://voiceseven.com/
    credit: "VOICEVOX:No.7"
    commercial_ok: true
    restricted_content: [criticism]
    notes: 個人・同人の動画の広告収入は明記して許可。法人アカウントなどの商用は要相談。権利侵害・著しいイメージ毀損は禁止。

  # ---------------- narrator voices (Irodori-TTS v4.1 Small on a lab GPU)
  # Designed from a text description, auditioned and chosen by the user (2026-11-04), then frozen: the
  # reference is 4 clips (~30 s) in assets/media/voices/<id>/ (gitignored; rebuild with
  # `python -m vg.narrator freeze` from the audition caption + seed if lost).
  # Model: MIT; codec Aratako/Semantic-DACVAE-Japanese-32dim: MIT (derived from facebook/dacvae-watermarked,
  # Apache-2.0). Outputs carry the model's inaudible AI watermark (silentcipher, MIT).
  - id: narrator_female        # main narrator (user's favourite)
    engine: irodori
    status: active
    model: Aratako/Irodori-TTS-v4.1-Small
    name: 女性ナレーター
    aliases: [女性ナレーター, ナレーター（女性）, 女性の声, ナレーター]
    gender: female
    tone: [明るい, 親しみやすい, 明瞭, 解説]
    role: narrator
    voice_description: 明るく親しみやすい女性ナレーター
    reference: assets/media/voices/narrator_female
    seed: 1001
    speed: 1.4
    license: MIT (Irodori-TTS v4.1 Small)
    license_url: https://huggingface.co/Aratako/Irodori-TTS-v4.1-Small
    commercial_ok: true

  - id: narrator_male
    engine: irodori
    status: active
    model: Aratako/Irodori-TTS-v4.1-Small
    name: 男性ナレーター
    aliases: [男性ナレーター, ナレーター（男性）, 男性の声]
    gender: male
    tone: [明瞭, 爽やか, 若い, 解説]
    role: narrator
    voice_description: 明瞭で爽やかな若い男性ナレーター
    reference: assets/media/voices/narrator_male
    seed: 1001
    speed: 1.4
    license: MIT (Irodori-TTS v4.1 Small)
    license_url: https://huggingface.co/Aratako/Irodori-TTS-v4.1-Small
    commercial_ok: true

# Not loaded: terms do not clearly permit this project's intended uses.
excluded:
  - {name: 青山龍星, reason: "法人・個人事業主・スポンサー付きの利用は ななはぴ への事前許可が必要"}
  - {name: Sarashina2.2-TTS, reason: "非商用ライセンス"}
  - {name: F5-TTS official weights, reason: "CC-BY-NC"}
  - {name: Fish Speech S1-mini / S2-Pro, reason: "重みが非商用・研究用"}
  - {name: "AivisHub の ACML-NC モデル", reason: "商用利用を禁止"}
