id: dialogue_explainer
name: 掛け合い解説
status: experimental
priority: P1
description: 聞き役の疑問に解説役が図と根拠で答え、誤解を解く二人の会話を構成する。
use_when: [オリジナルの二人で雲のでき方を説明して, 聞き役が疑問を挟む科学解説を作って, 二人の会話で単位の違いを教えて]
avoid_when: [特定対象への批判や政治・宗教活動, 立ち絵の許諾がないキャラクター利用]
pipeline: dialogue
timing: narration
length:
  youtube_shorts: {target: 45, min: 30, max: 59}
  tiktok: {target: 70, min: 61, max: 90}
  x: {target: 70, max: 140}
research: {required: true, min_sources: 2, recency_days: null}
voice: {questioner: [vv_zundamon], explainer: [vv_metan]}
components: [hook_title, character_pair, ken_burns_image, source_card, end_card]
models: [tts, t2i, music, asr, vlm]
params: {realistic_imagery: false, check_character_art_license: true}
qa: [duration, loudness, safe_area, yomi, facts, originality, rights]
risks: [総合リスク：中, キャラクター音声と立ち絵の利用条件, 会話による誤情報の断定, 定型的な掛け合いの反復]
monetization: 毎回固有の疑問と反例を会話に組み込み、自作図と出典を使って理解に至る過程を描く。
