id: history_story
name: 歴史の転換点
status: planned
priority: P2
description: 歴史上の一つの決断とその結果を、出典に基づく年表と再現イラストで描く。
use_when: [鉄道開通が町を変えた転換点を描いて, ある発明が普及する決断を歴史動画にして, 交易路が変わった経緯を説明して]
avoid_when: [史料のない逸話の事実扱い, 政治や宗教の宣伝]
pipeline: narration_stills
timing: narration
length:
  youtube_shorts: {target: 45, min: 30, max: 59}
  tiktok: {target: 70, min: 61, max: 90}
  x: {target: 70, max: 140}
research: {required: true, min_sources: 2, recency_days: null}
voice: {narrator: [default]}
components: [hook_title, caption, timeline, ken_burns_image, source_card, end_card, bgm]
models: [tts, t2i, music, asr, vlm]
params: {turning_points: 1, realistic_imagery: false, label_reconstructions: true}
qa: [duration, loudness, safe_area, yomi, facts, originality, rights]
risks: [総合リスク：中, 史実と創作的再現の混同, 単一の原因への過度な単純化]
monetization: 毎回一つの決断に焦点を絞り、史料の比較と独自の年表・再現図で結果まで説明する。
