id: news_digest
name: ニュースまとめ
status: planned
priority: P1
description: 最近の出来事を独立した出典で照合し、確認済みの事実と報道上の情報を区別して時系列に整理する。
use_when: [新サービス発表の経緯をまとめて, 企業の公式発表と報道を時系列で説明して, 最近の制度変更の経緯を動画にして]
avoid_when: [個人への疑惑や未確認の告発, 推測で原因や責任を断定する依頼, 政治活動や宗教活動を支援する内容]
pipeline: narration_stills
timing: narration
length:
  youtube_shorts: {target: 70, min: 61, max: 90}
  tiktok: {target: 70, min: 61, max: 90}
  x: {target: 70, max: 140}
research: {required: true, min_sources: 3, recency_days: 30}
voice: {narrator: [narrator_male_calm, vv_himari, default]}
content: [criticism]
components: [hook_title, caption, timeline, source_card, quote_card, end_card, bgm]
models: [tts, music, asr, vlm]
params: {min_independent_sources: 3, allow_speculation: false, allow_personal_allegations: false}
qa: [duration, loudness, safe_area, yomi, facts, originality, rights, sensitivity]
risks: [総合リスク：高, 誤報や名誉毀損, 更新による情報の陳腐化, 音声規約と批判内容の不適合]
monetization: 毎回複数の独立した資料を照合し、固有の時系列と背景説明を編集して報道の単純転載を避ける。
