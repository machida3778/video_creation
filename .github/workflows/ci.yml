name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync
      - run: uv run python -m unittest discover -s tests -v
      - run: python3 .claude/hooks/test_check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
        working-directory: render
      - run: npx tsc --noEmit
        working-directory: render
